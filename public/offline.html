<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141a17" />
    <meta name="theme-color" id="offline-theme-color" content="#141a17" />
    <title>Offline • Snowflex People Operations</title>
    <style>
      :root {
        --bg: #f7f8f4;
        --card-bg: #ffffff;
        --card-border: #e2e8df;
        --text-primary: #20251f;
        --text-muted: #617166;
        --card-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
        --tip-border: #e2e8df;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141a17;
          --card-bg: #1c2520;
          --card-border: #2d3a31;
          --text-primary: #edf5ef;
          --text-muted: #9cb2a3;
          --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
          --tip-border: #233127;
        }
      }
      html.dark, html[data-theme='dark'] {
        --bg: #141a17;
        --card-bg: #1c2520;
        --card-border: #2d3a31;
        --text-primary: #edf5ef;
        --text-muted: #9cb2a3;
        --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        --tip-border: #233127;
      }
      html.light, html[data-theme='light'] {
        --bg: #f7f8f4;
        --card-bg: #ffffff;
        --card-border: #e2e8df;
        --text-primary: #20251f;
        --text-muted: #617166;
        --card-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
        --tip-border: #e2e8df;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        max-width: 440px;
        width: 100%;
        padding: 36px 28px;
        box-shadow: var(--card-shadow);
      }
      .icon-circle {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px auto;
        color: #10b981;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 10px;
        color: var(--text-primary);
      }
      p {
        font-size: 14px;
        line-height: 1.55;
        color: var(--text-muted);
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 14px 20px;
        background: #193c33;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
      }
      .btn:hover {
        background: #255246;
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0);
      }
      .tip {
        margin-top: 20px;
        font-size: 12px;
        color: var(--text-muted);
        border-top: 1px solid var(--tip-border);
        padding-top: 16px;
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('snowflex.theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var mode = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', mode);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var meta = document.getElementById('offline-theme-color');
          if (meta) meta.setAttribute('content', isDark ? '#141a17' : '#f7f8f4');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div class="card">
      <div class="icon-circle">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>You Are Offline</h1>
      <p>
        Snowflex requires an active network connection to securely authenticate your credentials, verify camera attendance, and sync shift records.
      </p>
      <button class="btn" onclick="window.location.reload()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        <span>Retry Connection</span>
      </button>
      <div class="tip">
        Please check your Wi-Fi or mobile data settings. Once back online, tap Retry to resume your shift session.
      </div>
    </div>
  </body>
</html>
