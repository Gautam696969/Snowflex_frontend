<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon-blue.svg" />
    <meta name="description" content="SnowFlex is the enterprise Employee Management System powered by Snowflake Data Cloud. Streamline employee profiles, smart attendance, leave approvals, automated payroll, and AI HR Copilot." />
    <meta name="keywords" content="employee management system, HRIS, Snowflake HR, attendance tracking, leave management, payroll software, people operations, HR AI copilot" />
    <meta name="theme-color" content="#0284c7" />
    <meta property="og:title" content="SnowFlex — Enterprise Employee Management System" />
    <meta property="og:description" content="Unify employee profiles, attendance, multi-tiered leave approvals, payroll, and real-time AI assistance on a singular Snowflake data platform." />
    <meta property="og:type" content="website" />
    <link href="https://fonts.googleapis.com/css?family=Anton|Passion+One|PT+Sans+Caption" rel="stylesheet" type="text/css" />
    <title>SnowFlex — Enterprise Employee Management System & People Operations</title>
    <script>
      (function () {
        var redirect = sessionStorage.redirect
        delete sessionStorage.redirect
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect)
        }
        try {
          var isLanding = window.location.pathname === '/' || window.location.pathname === ''
          var fav = document.getElementById('app-favicon')
          if (fav) {
            fav.href = isLanding ? '/favicon-blue.svg' : '/favicon-green.svg'
          }
          var metaTheme = document.querySelector('meta[name="theme-color"]')
          if (metaTheme) {
            metaTheme.content = isLanding ? '#0284c7' : '#193c33'
          }
          var savedTheme = localStorage.getItem('snowflex.theme')
          var theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
          if (theme === 'dark') {
            document.documentElement.classList.add('dark')
          } else {
            document.documentElement.classList.remove('dark')
          }
          document.documentElement.style.colorScheme = theme

          var customThemeRaw = localStorage.getItem('snowflex.custom_theme')
          if (customThemeRaw) {
            try {
              var ct = JSON.parse(customThemeRaw)
              var hexRegex = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/
              if (ct) {
                // Only use ct.mode if user hasn't made an explicit manual toggle in snowflex.theme
                if (!savedTheme && (ct.mode === 'light' || ct.mode === 'dark')) {
                  theme = ct.mode
                  document.documentElement.dataset.theme = theme
                  if (theme === 'dark') {
                    document.documentElement.classList.add('dark')
                  } else {
                    document.documentElement.classList.remove('dark')
                  }
                  document.documentElement.style.colorScheme = theme
                }
                var s = document.documentElement.style
                s.setProperty('--has-custom-theme', '1')
                if (ct.sidebarColor && hexRegex.test(ct.sidebarColor)) s.setProperty('--custom-sidebar', ct.sidebarColor)
                if (ct.accentColor && hexRegex.test(ct.accentColor)) s.setProperty('--custom-accent', ct.accentColor)

                if (theme === 'dark') {
                  if (ct.bgColor && hexRegex.test(ct.bgColor)) s.setProperty('--custom-dark-bg', ct.bgColor)
                  if (ct.cardColor && hexRegex.test(ct.cardColor)) s.setProperty('--custom-dark-card', ct.cardColor)
                } else {
                  if (ct.bgColor && hexRegex.test(ct.bgColor)) s.setProperty('--custom-bg', ct.bgColor)
                  if (ct.cardColor && hexRegex.test(ct.cardColor)) s.setProperty('--custom-card', ct.cardColor)
                  if (ct.textColor && hexRegex.test(ct.textColor)) s.setProperty('--custom-text', ct.textColor)
                }
              }
            } catch (e) {}
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
